# Nginx設定ファイル for Ghost CMS + Frontend
# /etc/nginx/sites-available/yourdomain.com に配置

upstream ghost {
    server 127.0.0.1:2368;
}

# HTTPからHTTPSへリダイレクト
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt認証用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS設定
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # SSL証明書（Let's Encryptで取得）
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # セキュリティヘッダー
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ログ
    access_log /var/log/nginx/ghost.access.log;
    error_log /var/log/nginx/ghost.error.log;

    # フロントエンド静的ファイル（メインページ）
    location = / {
        root /var/www/blog;
        try_files /index.html =404;
    }

    # フロントエンド静的ファイル（記事詳細ページ）
    location /post.html {
        root /var/www/blog;
        try_files /post.html =404;
    }

    # CSS, JS, その他静的ファイル
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/blog;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ghost管理画面とContent API（プロキシ）
    location ~ ^/(ghost|content|admin|members|p|api|assets|public) {
        proxy_pass http://ghost;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSocket対応（Ghost管理画面用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # タイムアウト設定
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # バッファ設定
        proxy_buffering off;
        client_max_body_size 50m;
    }

    # その他のリクエストは404
    location / {
        return 404;
    }
}
