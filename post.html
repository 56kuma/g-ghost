<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事 | Ghost CMS Blog</title>
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="stylesheet" href="post-styles.css?v=3">
</head>
<body class="post-page">
    <header class="post-header">
        <div class="container">
            <a href="index.html" class="back-link">← ブログに戻る</a>
        </div>
    </header>

    <main class="post-main">
        <div class="container">
            <div id="loading" class="loading">
                <div class="spinner earth"></div>
                <p>記事を読み込んでいます...</p>
            </div>

            <div id="error" class="error" style="display: none;">
                <p class="error-message"></p>
            </div>

            <article id="post-content" class="post-article" style="display: none;">
                <div class="post-hero">
                    <img id="post-image" src="" alt="" class="post-hero-image">
                </div>
                <div class="post-body">
                    <div id="post-tags" class="post-tags"></div>
                    <h1 id="post-title" class="post-title"></h1>
                    <div id="post-meta" class="post-meta"></div>

                    <!-- Table of Contents - Before Content -->
                    <aside id="toc-sidebar" class="toc-sidebar">
                        <div class="toc-wrapper">
                            <h3 class="toc-title">目次</h3>
                            <nav id="toc-nav" class="toc-nav">
                                <p style="color: var(--earth-primary); font-size: 0.9rem;">読み込み中...</p>
                            </nav>
                        </div>
                    </aside>

                    <div id="post-html" class="post-content"></div>
                </div>
            </article>
        </div>
    </main>

    <footer class="post-footer">
        <div class="container">
            <p>&copy; 2025 Ghost CMS Blog. Powered by Ghost.</p>
        </div>
    </footer>

    <script type="module" src="post.js?v=3"></script>
</body>
</html>
