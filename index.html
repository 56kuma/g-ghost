<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost CMS Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="header-title">Ghost CMS Blog</h1>
            <p class="header-subtitle">ヘッドレスCMSで構築されたモダンなブログ</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>投稿を読み込んでいます...</p>
            </div>

            <div id="error" class="error" style="display: none;">
                <p class="error-message"></p>
            </div>

            <!-- Tag Filter Section -->
            <div class="tags-filter-section">
                <h3 class="filter-title">タグで絞り込む</h3>
                <div id="tags-container" class="tags-filter">
                    <!-- Tags will be dynamically inserted here -->
                </div>
            </div>

            <div id="posts-container" class="posts-grid">
                <!-- Posts will be dynamically inserted here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Ghost CMS Blog. Powered by Ghost.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
